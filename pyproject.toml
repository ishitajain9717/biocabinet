[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocabinet"
version = "0.1.0"
description = "Agentic multi-modal transcriptomics pipeline powered by LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "rna-seq", "bioinformatics", "langgraph", "llm", "agent",
    "differential-expression", "single-cell", "spatial-transcriptomics",
    "gnn", "rag", "pathway-enrichment",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    # "License :: OSI Approved :: MIT License",  # redundant with license = "MIT"
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# All flat [project] keys must come before any [project.*] sub-tables
dependencies = [
    # ── LangGraph / LangChain core ─────────────────────────────────────────
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.1.0",

    # ── Numerics ───────────────────────────────────────────────────────────
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",

    # ── Deep learning (BioBERT RAG embeddings need torch) ──────────────────
    "torch>=2.0",
    "transformers>=4.40",

    # ── Bioinformatics core ────────────────────────────────────────────────
    "pydeseq2>=0.4",
    "scanpy>=1.10",
    "mygene>=3.2",

    # ── Config / observability ─────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "langsmith>=0.1",
    "requests>=2.31",
    "tenacity>=8.2",
]

# ── Sub-tables must come after all flat [project] keys ─────────────────────

[project.urls]
Homepage      = "https://github.com/ishitajain9717/biocabinet"
Source        = "https://github.com/ishitajain9717/biocabinet"
"Bug Tracker" = "https://github.com/ishitajain9717/biocabinet/issues"

[project.optional-dependencies]
# LLM back-ends
llm-openai = ["langchain-openai>=0.1"]
llm-ollama = ["langchain-ollama>=0.1"]
llm        = ["langchain-openai>=0.1", "langchain-ollama>=0.1"]

# GNN-based PPI enrichment (torch-geometric + ESM-2)
gnn = [
    "torch-geometric>=2.5",
    "fair-esm>=2.0.0",
]

# Spatial omics – imaging-based (MERSCOPE / Vizgen)
spatial = [
    "squidpy>=1.6",
    "harmonypy>=0.0.10",
]

# Trajectory inference for scRNA
trajectory = [
    "palantir>=1.3",
]

# Everything — for development or full feature set
full = [
    "langchain-openai>=0.1",
    "langchain-ollama>=0.1",
    "torch-geometric>=2.5",
    "fair-esm>=2.0.0",
    "squidpy>=1.6",
    "harmonypy>=0.0.10",
    "palantir>=1.3",
]

# Dev tools
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "jupyter>=1.0",
]

[project.scripts]
rnaseq-agent = "scripts.orchestrator:run"

[tool.setuptools.packages.find]
where   = ["."]
include = ["scripts*"]

[tool.setuptools.package-data]
"scripts" = ["py.typed"]
