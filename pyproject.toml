[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocabinet"
version = "0.1.0"
description = "Agentic multi-modal transcriptomics pipeline powered by LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

keywords = [
    "rna-seq", "bioinformatics", "langgraph", "llm", "agent",
    "differential-expression", "single-cell", "spatial-transcriptomics",
    "gnn", "rag", "pathway-enrichment",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage   = "https://github.com/ishitajain9717/biocabinet"
Source     = "https://github.com/ishitajain9717/biocabinet"
"Bug Tracker" = "https://github.com/ishitajain9717/biocabinet/issues"

dependencies = [
    # ── LangGraph / LangChain core ─────────────────────────────────────────
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.1.0",

    # ── Numerics ───────────────────────────────────────────────────────────
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",

    # ── Deep learning (needed for BioBERT RAG embeddings) ──────────────────
    # torch is kept core because transformers/BioBERT requires it for the RAG
    "torch>=2.0",
    "transformers>=4.40",          # BioBERT pathway embeddings (RAG)

    # ── Bioinformatics core ────────────────────────────────────────────────
    "pydeseq2>=0.4",               # differential expression (DESeq2)
    "scanpy>=1.10",                # scRNA-seq preprocessing + UMAP/Leiden
    "mygene>=3.2",                 # ENSG → ENSP ID mapping

    # ── Config / observability ─────────────────────────────────────────────
    "python-dotenv>=1.0.0",        # auto-load LLM config from .env
    "langsmith>=0.1",              # LangGraph tracing (opt-in via env var)
    "requests>=2.31",
    "tenacity>=8.2",               # retry logic for external API calls
]

[project.optional-dependencies]
# ── LLM back-ends (choose one or both) ─────────────────────────────────────
llm-openai = ["langchain-openai>=0.1"]
llm-ollama = ["langchain-ollama>=0.1"]
llm        = ["langchain-openai>=0.1", "langchain-ollama>=0.1"]

# ── GNN-based PPI enrichment ───────────────────────────────────────────────
# Requires torch-geometric and ESM-2 protein language model.
# Install with: pip install "biocabinet[gnn]"
gnn = [
    "torch-geometric>=2.5",
    "fair-esm>=2.0.0",             # ESM-2 protein sequence embeddings
]

# ── Spatial omics (imaging-based, e.g. MERSCOPE/Vizgen) ────────────────────
# Install with: pip install "biocabinet[spatial]"
spatial = [
    "squidpy>=1.6",                # Vizgen cell-table reader + spatial stats
    "harmonypy>=0.0.10",           # FOV batch correction
]

# ── Optional trajectory inference (scRNA) ──────────────────────────────────
# Install with: pip install "biocabinet[trajectory]"
trajectory = [
    "palantir>=1.3",               # pseudotime + lineage inference
]

# ── Everything (for development / full feature set) ─────────────────────────
full = [
    "langchain-openai>=0.1",
    "langchain-ollama>=0.1",
    "torch-geometric>=2.5",
    "fair-esm>=2.0.0",
    "squidpy>=1.6",
    "harmonypy>=0.0.10",
    "palantir>=1.3",
]

# ── Development tools ───────────────────────────────────────────────────────
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
    "jupyter>=1.0",
]

[project.scripts]
rnaseq-agent = "scripts.orchestrator:run"

[tool.setuptools.packages.find]
where   = ["."]
include = ["scripts*"]

[tool.setuptools.package-data]
"scripts" = ["py.typed"]
