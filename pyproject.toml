[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocabinet"
version = "0.1.0"
description = "Agentic transcriptomic preprocessing and enrichment pipeline powered by LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

keywords = [
    "rna-seq", "bioinformatics", "langgraph", "gnn", "rag",
    "differential-expression", "ppi", "pathway-enrichment","scRNA","spatial trancriptomics"
]

dependencies = [
    # ── LangGraph / LangChain core ──────────────────────────────────────────
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=0.1.0",

    # ── Numerics ────────────────────────────────────────────────────────────
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",

    # ── Deep learning ───────────────────────────────────────────────────────
    "torch>=2.0",
    "torch-geometric>=2.5",
    "transformers>=4.40",          # BioBERT pathway embeddings
    "fair-esm>=2.0.0",             # ESM-2 protein sequence embeddings

    # ── Bioinformatics ──────────────────────────────────────────────────────
    "pydeseq2>=0.4",               # differential expression (DESeq2)
    "scanpy>=1.10",                # scRNA-seq + spatial preprocessing
    "palantir>=1.3",               # pseudotime + lineage inference (optional; trajectory only)
    "squidpy>=1.6",                # MERSCOPE/Vizgen cell-table reader
    "harmonypy>=0.0.10",           # FOV batch correction (spatial bias loop)
    "mygene>=3.2",                 # ENSG → ENSP mapping via mygene.info

    # ── Config / API ────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",        # auto-load LLM config from .env
    "langsmith>=0.1",              # LangGraph tracing (opt-in via LANGCHAIN_TRACING_V2)
    "requests>=2.31",
    "tenacity>=8.2",               # retry logic for external API calls
]

[project.optional-dependencies]
llm-openai = ["langchain-openai>=0.1"]
llm-ollama = ["langchain-ollama>=0.1"]
llm = ["langchain-openai>=0.1", "langchain-ollama>=0.1"]

dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[project.scripts]
rnaseq-agent = "scripts.orchestrator:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.setuptools.package-data]
"scripts" = ["py.typed"]
