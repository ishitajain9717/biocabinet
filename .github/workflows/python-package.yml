name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tools
        # setuptools>=77 is required by pyproject.toml (license-files support)
        run: python -m pip install --upgrade pip "setuptools>=77" wheel

      - name: Install core dependencies
        run: |
          # Install torch first — heavy, but needed for BioBERT RAG embeddings
          pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
          # Install the package in editable mode (resolves all core deps)
          pip install -e .
          # Install test runner and linter
          pip install pytest flake8

      - name: Lint with flake8 (syntax / undefined names only)
        run: |
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Import smoke tests
        run: |
          pytest tests/ -q
