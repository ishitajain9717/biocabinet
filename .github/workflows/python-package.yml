name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          # PyTorch first — torch-geometric expects torch to already be present
          pip install "torch>=2.0"
          pip install "torch-geometric>=2.5"
          pip install -r requirements.txt
          # Register the `scripts` package so tests can `from scripts... import`
          pip install -e .

      - name: Lint with flake8 (syntax / undefined names only)
        run: |
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Import smoke tests
        run: |
          pytest tests/ -q
